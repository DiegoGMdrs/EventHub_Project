
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Descubra eventos, experiências e encontros com o EventHub.">

    <title>EventHub | Descubra novos eventos</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- LUCIDE ICONS -->
    <script src="https://unpkg.com/lucide@latest" defer></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Swiper JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js" defer></script>

    <!-- JavaScript -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- ============ HEADER ============ -->

    <header class="main-header">

        <div class="header-container">

            <!-- LOGO -->
            <a href="index.html" class="logo">
                Event<span>Hub</span>.
            </a>

            <!-- NAVEGAÇÃO -->
            <nav class="main-nav">

                <ul>
                    <li><a href="#">Explorar</a></li>
                    <li><a href="#">Categorias</a></li>
                    <li><a href="#">Para organizadores</a></li>
                </ul>

            </nav>

            <!-- AÇÕES DO USUÁRIO -->
            <div class="header-actions">

                <a href="#" class="login-link">
                    Entrar
                </a>

                <a href="#" class="register-button">
                    Criar conta
                </a>

            </div>

        </div>

    </header>


    <!-- ============ MAIN CONTENT============ -->

    <main>

        <!-- ============ HERO SEARCH ============ -->

        <section class="hero">

            <div class="hero-container">

                <div class="hero-content">

                    <!-- IDENTIFICAÇÃO -->
                    <span class="hero-label">
                        DESCUBRA ALGO NOVO
                    </span>


                    <!-- TÍTULO -->
                    <h1>
                        Seu próximo momento
                        <span>começa aqui.</span>
                    </h1>


                    <!-- DESCRIÇÃO -->
                    <p>
                        Explore eventos, conheça novas experiências
                        e encontre algo especial para fazer.
                    </p>

                    <!-- FORMULÁRIO DE PESQUISA -->
                    <form class="search-form">

                        <!-- CAMPO DE PESQUISA -->
                        <div class="search-field">

                            <label for="event-search">
                                <i data-lucide="search"></i>
                                O que você procura?
                            </label>

                            <input
                                type="text"
                                id="event-search"
                                name="event-search"
                                placeholder="Shows, festivais, cursos..."
                            >

                        </div>


                        <!-- CAMPO DE LOCALIZAÇÃO -->
                        <div class="search-field">

                            <label for="event-location">
                                <i data-lucide="map-pin"></i>
                                Onde?
                            </label>

                            <input
                                type="text"
                                id="event-location"
                                name="event-location"
                                placeholder="Cidade ou região"
                            >

                        </div>


                        <!-- BOTÃO -->
                        <button type="submit">
                            Buscar eventos
                            <i data-lucide="arrow-right"></i>
                        </button>

                    </form>

                </div>

            </div>

        </section>
        <section class="hero-carousel">

    <div class="carousel-container">

        <div class="swiper">

            <div class="swiper-wrapper">

                <!-- Slide 1 -->
                <div class="swiper-slide">
                    <img src="https://images.sympla.com.br/6ad147b5bc700-lg.png" alt="Show musical">
                </div>

                <!-- Slide 2 -->
                <div class="swiper-slide">
                    <img src="https://images.sympla.com.br/6abe653aa65de-lg.jpg" alt="Festival gastronômico">
                </div>

                <!-- Slide 3 -->
                <div class="swiper-slide">
                    <img src="https://images.sympla.com.br/6ae9d85b98312-lg.png" alt="Evento de tecnologia">
                </div>

                <!-- Slide 4 -->
                <div class="swiper-slide">
                    <img src="https://assets.bileto.sympla.com.br/eventmanager/production/3n3hfn6fo6417ehn79e0d4oqms13uhc9b3csdu22q3tqg430l1a7e748tol5201dcj0tgrdkgdqe891m61h7ei9sflurnruqrcuoh30.jpeg" alt="Evento cultural">
                </div>

            </div>

            <!-- Indicadores -->
            <div class="swiper-pagination"></div>

            <!-- Setas de navegação -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>

        </div>

    </div>

</section>

    </main>

    <footer>

    </footer>

</body>

</html>
